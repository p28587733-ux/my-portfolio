<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作品集 · 请验证访问</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body {
  font-family: 'Noto Sans SC', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: #000;
  color: #f5f5f7;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
.gate {
  text-align: center;
  padding: 2rem;
  max-width: 380px;
  width: 100%;
}
.gate h1 {
  font-size: 1.6rem;
  font-weight: 500;
  letter-spacing: 0.06em;
  margin-bottom: 0.6rem;
}
.gate p {
  font-size: 0.8rem;
  color: #6e6e73;
  margin-bottom: 2rem;
  font-weight: 300;
}
.gate input {
  width: 100%;
  padding: 0.85rem 1.2rem;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 100px;
  color: #f5f5f7;
  font-size: 0.9rem;
  font-family: inherit;
  text-align: center;
  letter-spacing: 0.2em;
  outline: none;
  transition: border-color 0.3s;
}
.gate input:focus {
  border-color: #2997ff;
}
.gate .btn {
  width: 100%;
  margin-top: 0.8rem;
  padding: 0.75rem;
  background: #2997ff;
  color: #fff;
  border: none;
  border-radius: 100px;
  font-size: 0.85rem;
  font-family: inherit;
  cursor: pointer;
  letter-spacing: 0.08em;
  transition: background 0.3s;
}
.gate .btn:hover { background: #4da8ff; }
.gate .error {
  color: #ff4d4d;
  font-size: 0.72rem;
  margin-top: 0.6rem;
  display: none;
}
</style>
</head>
<body>
<div class="gate">
  <h1>作品集</h1>
  <p>请输入访问密码查看</p>
  <input type="password" id="pwd" placeholder="输入密码" autofocus>
  <button class="btn" onclick="check()">验证访问</button>
  <p class="error" id="err">密码错误，请重试</p>
</div>
<script>
function check() {
  if (document.getElementById('pwd').value === 'panrui2026') {
    sessionStorage.setItem('_granted', '1');
    location.href = 'main.html';
  } else {
    document.getElementById('err').style.display = 'block';
  }
}
document.getElementById('pwd').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') check();
});
</script>
</body>
</html>
